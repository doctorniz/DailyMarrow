name: Docker Build Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker buildx build \
            --load \
            --tag daily-marrow:test \
            .

      # Same checks as running ./test-docker.sh locally; any failure fails the job
      - name: Smoke-test the container
        env:
          SKIP_BUILD: "1"
        run: ./test-docker.sh
