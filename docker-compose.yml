version: '3.8'

services:
  daily-marrow:
    build: .
    ports:
      - "5551:5551"
    volumes:
      - news-data:/app/news
    environment:
      - NEWS_PORT=5551
      - NEWS_HOST=0.0.0.0
      # Starting values only: once saved on the /settings page, the saved values win.
      - FETCH_TTL_SECONDS=3600
      # Optional fixed admin password for /settings. Without it, the server
      # prints a one-time setup code to its log on first run.
      # - NEWS_ADMIN_PASSWORD=change-me
      # Behind nginx on the Docker host, trust the bridge network so rate
      # limits see each visitor's IP (from X-Forwarded-For) instead of one IP.
      # - NEWS_TRUSTED_PROXIES=127.0.0.1,::1,172.16.0.0/12
    restart: unless-stopped

volumes:
  news-data:
