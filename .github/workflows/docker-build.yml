name: Docker Build Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # same Python as the Docker image (python:3.11-slim)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit and HTTP tests
        run: python -m unittest discover -s tests -v

  build:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker buildx build \
            --load \
            --tag daily-marrow:test \
            .

      # Same checks as running ./test-docker.sh locally; any failure fails the job
      - name: Smoke-test the container
        env:
          SKIP_BUILD: "1"
        run: ./test-docker.sh
